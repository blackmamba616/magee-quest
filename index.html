<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Magee Quest - Level 1</title>
<style>
  :root{
    --bg:#0f172a;
    --panel:#111827;
    --text:#f8fafc;
    --accent:#fbbf24;
    --accent2:#22c55e;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:linear-gradient(180deg,#111827,#020617);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    color:var(--text);
  }
  .wrap{width:min(1100px,96vw)}
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin:0 0 10px;
    padding:10px 14px;
    background:rgba(15,23,42,.85);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
  }
  .brand{font-weight:900;letter-spacing:.08em;text-transform:uppercase}
  .hint{font-size:14px;opacity:.8}
  .game-shell{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    border:2px solid rgba(255,255,255,.1);
    background:#000;
  }
  canvas{
    width:100%;
    height:auto;
    display:block;
    image-rendering:pixelated;
  }
  .overlay{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    background:rgba(2,6,23,.62);
    padding:24px;
  }
  .card{
    width:min(540px,92%);
    text-align:center;
    padding:28px;
    border-radius:18px;
    background:rgba(15,23,42,.94);
  }
  h1{margin:0 0 6px;font-size:clamp(28px,4vw,48px)}
  p{line-height:1.5}
  button{
    border:0;
    border-radius:12px;
    padding:12px 18px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    background:var(--accent);
    color:#111827;
  }
  .small{margin-top:8px;font-size:13px;opacity:.75}
  .footer{text-align:center;margin-top:10px;font-size:13px;opacity:.72}

  .touch-controls{
    position:absolute;
    left:0;
    right:0;
    bottom:max(14px, env(safe-area-inset-bottom));
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding:0 16px;
    pointer-events:none;
    z-index:5;
  }
  .touch-group{
    display:flex;
    gap:12px;
    pointer-events:auto;
  }
  .touch-btn{
    width:72px;
    height:72px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.28);
    background:rgba(15,23,42,.72);
    color:white;
    font-size:30px;
    font-weight:900;
    display:grid;
    place-items:center;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .touch-btn.jump{
    width:82px;
    height:82px;
    background:rgba(251,191,36,.88);
    color:#111827;
  }
  .touch-btn.active{transform:scale(.94)}

  @media (hover:hover) and (pointer:fine){
    .touch-controls{display:none}
  }

  @media (max-width:700px){
    body{
      min-height:100dvh;
      display:block;
      background:#020617;
      overflow:hidden;
    }
    .wrap{
      width:100vw;
      height:100dvh;
      display:flex;
      flex-direction:column;
    }
    .topbar{
      margin:0;
      border-radius:0;
      padding:8px 10px;
    }
    .hint{font-size:12px}
    .game-shell{
      flex:1;
      border-radius:0;
      border-left:0;
      border-right:0;
      display:flex;
      align-items:center;
    }
    canvas{
      width:100%;
      height:auto;
      max-height:calc(100dvh - 74px);
      object-fit:contain;
    }
    .footer{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">Magee Quest — Level 1</div>
    <div class="hint">Keyboard or touch controls</div>
  </div>

  <div class="game-shell">
    <canvas id="game" width="960" height="540"></canvas>

    <div class="touch-controls">
      <div class="touch-group">
        <div class="touch-btn" id="leftBtn">◀</div>
        <div class="touch-btn" id="rightBtn">▶</div>
      </div>
      <div class="touch-group">
        <div class="touch-btn jump" id="jumpBtn">▲</div>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="card">
        <h1 id="overlayTitle">Magee Quest</h1>
        <p id="overlayText">
          Reach the golden flag, collect coins, and bounce on enemies.
          On iPhone, use the arrows and jump button. Landscape works best.
        </p>
        <button id="startBtn">Start Level 1</button>
        <div class="small">
          Floatier jumping, smoother air control, checkpoint, coins and enemies.
        </div>
      </div>
    </div>
  </div>

  <div class="footer">Magee Quest — Level 1</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');

  const W = canvas.width;
  const H = canvas.height;
  const worldWidth = 4700;

  const keys = {};
  const pressed = {};

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  const rectsOverlap=(a,b)=>(
    a.x < b.x+b.w &&
    a.x+a.w > b.x &&
    a.y < b.y+b.h &&
    a.y+a.h > b.y
  );

  let state='menu';
  let score=0;
  let cameraX=0;
  let checkpointX=80;
  let particles=[];

  const player={
    x:80,y:380,w:34,h:46,
    vx:0,vy:0,
    speed:.48,
    airSpeed:.30,
    maxSpeed:5.4,
    jump:-12.3,
    onGround:false,
    coyote:0,
    jumpBuffer:0,
    hearts:3,
    invuln:0,
    facing:1
  };

  const platforms=[
    {x:0,y:460,w:580,h:80,type:'ground'},
    {x:680,y:460,w:500,h:80,type:'ground'},
    {x:1280,y:460,w:420,h:80,type:'ground'},
    {x:1790,y:460,w:520,h:80,type:'ground'},
    {x:2430,y:460,w:440,h:80,type:'ground'},
    {x:3000,y:460,w:600,h:80,type:'ground'},
    {x:3700,y:460,w:1000,h:80,type:'ground'},

    {x:360,y:365,w:150,h:24,type:'brick'},
    {x:760,y:350,w:130,h:24,type:'brick'},
    {x:930,y:295,w:130,h:24,type:'brick'},
    {x:1360,y:370,w:150,h:24,type:'brick'},
    {x:1535,y:315,w:110,h:24,type:'brick'},
    {x:1910,y:365,w:150,h:24,type:'brick'},
    {x:2110,y:315,w:150,h:24,type:'brick'},
    {x:2500,y:350,w:150,h:24,type:'brick'},
    {x:2670,y:290,w:110,h:24,type:'brick'},
    {x:3110,y:365,w:150,h:24,type:'brick'},
    {x:3290,y:310,w:130,h:24,type:'brick'},
    {x:3860,y:360,w:150,h:24,type:'brick'},
    {x:4070,y:300,w:150,h:24,type:'brick'}
  ];

  const coins=[
    [410,330],[790,315],[960,260],[1020,260],[1400,335],[1570,280],
    [1950,330],[2160,280],[2540,315],[2705,255],
    [3150,330],[3340,275],[3900,325],[4120,265],
    [620,410],[1215,410],[1735,410],[2370,410],[2935,410],[3645,410]
  ].map(([x,y])=>({
    x,y,r:10,taken:false,phase:Math.random()*Math.PI*2
  }));

  const enemies=[
    {x:860,y:420,w:38,h:40,vx:-1.25,minX:700,maxX:1140,alive:true},
    {x:1450,y:420,w:38,h:40,vx:1.4,minX:1290,maxX:1670,alive:true},
    {x:2020,y:420,w:38,h:40,vx:-1.4,minX:1810,maxX:2280,alive:true},
    {x:3190,y:420,w:38,h:40,vx:1.55,minX:3010,maxX:3570,alive:true},
    {x:3950,y:420,w:38,h:40,vx:-1.55,minX:3710,maxX:4380,alive:true}
  ];

  const checkpoint={x:2740,y:380,w:18,h:80,active:false};
  const goal={x:4470,y:280,w:28,h:180};

  function resetGame(){
    player.x=80;
    player.y=380;
    player.vx=0;
    player.vy=0;
    player.hearts=3;
    player.invuln=0;
    player.coyote=0;
    player.jumpBuffer=0;

    checkpointX=80;
    checkpoint.active=false;
    score=0;

    coins.forEach(c=>c.taken=false);

    const starts=[860,1450,2020,3190,3950];
    enemies.forEach((e,i)=>{
      e.x=starts[i];
      e.alive=true;
    });

    cameraX=0;
    particles=[];
    state='playing';
  }

  function respawn(){
    player.x=checkpointX;
    player.y=350;
    player.vx=0;
    player.vy=0;
    player.invuln=120;
  }

  function loseHeart(){
    if(player.invuln>0 || state!=='playing') return;

    player.hearts--;

    if(player.hearts<=0){
      state='gameover';
      overlayTitle.textContent='Game Over';
      overlayText.textContent=`Score: ${score}`;
      startBtn.textContent='Restart Level 1';
      overlay.style.display='grid';
    }else{
      respawn();
    }
  }

  function win(){
    if(state!=='playing') return;

    state='won';
    score += 1000 + player.hearts*250;

    overlayTitle.textContent='Level Complete!';
    overlayText.textContent=`You reached the golden flag! Final score: ${score}`;
    startBtn.textContent='Play Again';
    overlay.style.display='grid';
  }

  function burst(x,y,n=10){
    for(let i=0;i<n;i++){
      particles.push({
        x,y,
        vx:(Math.random()-.5)*6,
        vy:(Math.random()-.9)*6,
        life:30+Math.random()*25,
        r:2+Math.random()*4
      });
    }
  }

  function circleRect(cx,cy,r,rect){
    const nx=clamp(cx,rect.x,rect.x+rect.w);
    const ny=clamp(cy,rect.y,rect.y+rect.h);
    const dx=cx-nx;
    const dy=cy-ny;
    return dx*dx+dy*dy<r*r;
  }

  function update(){
    if(state!=='playing') return;

    if(player.invuln>0) player.invuln--;

    const left=keys.ArrowLeft||keys.a||keys.A;
    const right=keys.ArrowRight||keys.d||keys.D;
    const jumpHeld=keys[' ']||keys.ArrowUp||keys.w||keys.W;
    const jumpPressed=pressed[' ']||pressed.ArrowUp||pressed.w||pressed.W;

    if(jumpPressed) player.jumpBuffer=8;
    else if(player.jumpBuffer>0) player.jumpBuffer--;

    if(player.onGround) player.coyote=7;
    else if(player.coyote>0) player.coyote--;

    const accel=player.onGround ? player.speed : player.airSpeed;

    if(left){
      player.vx-=accel;
      player.facing=-1;
    }

    if(right){
      player.vx+=accel;
      player.facing=1;
    }

    if(!left&&!right){
      player.vx*=player.onGround?.74:.94;
    }

    player.vx=clamp(player.vx,-player.maxSpeed,player.maxSpeed);

    if(player.jumpBuffer>0&&(player.onGround||player.coyote>0)){
      player.vy=player.jump;
      player.onGround=false;
      player.coyote=0;
      player.jumpBuffer=0;
    }

    let gravity=player.vy<0?.42:.54;

    if(!jumpHeld&&player.vy<-4){
      gravity=.78;
    }

    player.vy+=gravity;
    player.vy=Math.min(player.vy,13.5);

    player.x+=player.vx;
    player.x=clamp(player.x,0,worldWidth-player.w);

    for(const p of platforms){
      if(rectsOverlap(player,p)){
        if(player.vx>0) player.x=p.x-player.w;
        else if(player.vx<0) player.x=p.x+p.w;
        player.vx=0;
      }
    }

    player.onGround=false;
    player.y+=player.vy;

    for(const p of platforms){
      if(rectsOverlap(player,p)){
        if(player.vy>0){
          player.y=p.y-player.h;
          player.vy=0;
          player.onGround=true;
        }else if(player.vy<0){
          player.y=p.y+p.h;
          player.vy=0;
        }
      }
    }

    if(player.y>H+160){
      loseHeart();
    }

    for(const c of coins){
      if(!c.taken&&circleRect(c.x,c.y,c.r+6,player)){
        c.taken=true;
        score+=100;
        burst(c.x,c.y,8);
      }
      c.phase+=.08;
    }

    if(!checkpoint.active&&rectsOverlap(player,checkpoint)){
      checkpoint.active=true;
      checkpointX=checkpoint.x-40;
      score+=250;
      burst(checkpoint.x,checkpoint.y,18);
    }

    if(rectsOverlap(player,{
      x:goal.x-12,
      y:goal.y,
      w:50,
      h:goal.h
    })){
      win();
    }

    for(const e of enemies){
      if(!e.alive) continue;

      e.x+=e.vx;

      if(e.x<e.minX||e.x+e.w>e.maxX){
        e.vx*=-1;
      }

      if(rectsOverlap(player,e)){
        const playerBottom=player.y+player.h;
        const stomp=player.vy>1.5&&playerBottom-e.y<28;

        if(stomp){
          e.alive=false;
          player.vy=-9.5;
          score+=200;
          burst(e.x+e.w/2,e.y+10,12);
        }else{
          loseHeart();
        }
      }
    }

    const target=player.x-W*.36;
    cameraX+=(target-cameraX)*.1;
    cameraX=clamp(cameraX,0,worldWidth-W);

    for(const pt of particles){
      pt.x+=pt.vx;
      pt.y+=pt.vy;
      pt.vy+=.18;
      pt.life--;
    }

    particles=particles.filter(p=>p.life>0);

    for(const k in pressed){
      delete pressed[k];
    }
  }

  function drawSky(){
    const grd=ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,'#60a5fa');
    grd.addColorStop(.65,'#bae6fd');
    grd.addColorStop(1,'#e0f2fe');

    ctx.fillStyle=grd;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle='#93c5fd';
    for(let i=-1;i<8;i++){
      const x=i*240-(cameraX*.15)%240;
      ctx.beginPath();
      ctx.arc(x+100,470,160,Math.PI,0);
      ctx.fill();
    }

    ctx.fillStyle='#86efac';
    for(let i=-1;i<10;i++){
      const x=i*180-(cameraX*.28)%180;
      ctx.beginPath();
      ctx.arc(x+90,500,120,Math.PI,0);
      ctx.fill();
    }

    ctx.fillStyle='rgba(255,255,255,.9)';

    const clouds=[
      [180,100,.18],
      [650,150,.12],
      [1100,90,.2],
      [1700,130,.1],
      [2450,95,.16],
      [3300,145,.12],
      [4100,100,.18]
    ];

    for(const [wx,wy,par] of clouds){
      const x=wx-cameraX*par;

      ctx.beginPath();
      ctx.arc(x,wy,34,0,Math.PI*2);
      ctx.arc(x+36,wy-12,28,0,Math.PI*2);
      ctx.arc(x+70,wy,34,0,Math.PI*2);
      ctx.fill();
    }
  }

  function drawPlatform(p){
    const x=p.x-cameraX;

    if(p.type==='ground'){
      ctx.fillStyle='#22c55e';
      ctx.fillRect(x,p.y,p.w,18);

      ctx.fillStyle='#8b5a2b';
      ctx.fillRect(x,p.y+18,p.w,p.h-18);
    }else{
      ctx.fillStyle='#b45309';
      ctx.fillRect(x,p.y,p.w,p.h);

      ctx.strokeStyle='#78350f';
      ctx.lineWidth=3;
      ctx.strokeRect(x,p.y,p.w,p.h);
    }
  }

  function drawCoin(c){
    if(c.taken) return;

    const x=c.x-cameraX;
    const scale=.65+Math.abs(Math.sin(c.phase))*.35;

    ctx.save();
    ctx.translate(x,c.y);
    ctx.scale(scale,1);

    ctx.fillStyle='#facc15';
    ctx.beginPath();
    ctx.arc(0,0,c.r,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle='#ca8a04';
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.restore();
  }

  function drawEnemy(e){
    if(!e.alive) return;

    const x=e.x-cameraX;

    ctx.fillStyle='#7c3aed';
    ctx.fillRect(x,e.y+10,e.w,e.h-10);

    ctx.beginPath();
    ctx.arc(x+e.w/2,e.y+12,e.w/2,Math.PI,0);
    ctx.fill();

    ctx.fillStyle='#fff';
    ctx.fillRect(x+9,e.y+13,7,9);
    ctx.fillRect(x+23,e.y+13,7,9);

    ctx.fillStyle='#111827';
    ctx.fillRect(x+11,e.y+16,3,4);
    ctx.fillRect(x+25,e.y+16,3,4);
  }

  function drawCheckpoint(){
    const x=checkpoint.x-cameraX;

    ctx.fillStyle='#64748b';
    ctx.fillRect(x,checkpoint.y,7,checkpoint.h);

    ctx.fillStyle=checkpoint.active?'#22c55e':'#fb7185';

    ctx.beginPath();
    ctx.moveTo(x+7,checkpoint.y+10);
    ctx.lineTo(x+55,checkpoint.y+28);
    ctx.lineTo(x+7,checkpoint.y+46);
    ctx.closePath();
    ctx.fill();
  }

  function drawGoal(){
    const x=goal.x-cameraX;

    ctx.fillStyle='#6b7280';
    ctx.fillRect(x,goal.y,8,goal.h);

    ctx.fillStyle='#fbbf24';
    ctx.beginPath();
    ctx.moveTo(x+8,goal.y+8);
    ctx.lineTo(x+78,goal.y+34);
    ctx.lineTo(x+8,goal.y+60);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle='#111827';
    ctx.font='bold 18px system-ui';
    ctx.fillText('M',x+29,goal.y+41);
  }

  function drawPlayer(){
    if(player.invuln>0&&Math.floor(player.invuln/6)%2===0) return;

    const x=player.x-cameraX;
    const y=player.y;

    ctx.save();

    if(player.facing<0){
      ctx.translate(x+player.w/2,y);
      ctx.scale(-1,1);
      ctx.translate(-(x+player.w/2),-y);
    }

    // shoes
    ctx.fillStyle='#111827';
    ctx.fillRect(x+4,y+39,12,7);
    ctx.fillRect(x+20,y+39,12,7);

    // jeans
    ctx.fillStyle='#2563eb';
    ctx.fillRect(x+7,y+29,9,13);
    ctx.fillRect(x+19,y+29,9,13);

    // shirt
    ctx.fillStyle='#fff';
    ctx.fillRect(x+5,y+17,25,16);

    // small Magee-style shirt mark
    ctx.fillStyle='#111827';
    ctx.fillRect(x+14,y+21,3,7);
    ctx.fillRect(x+20,y+21,3,7);
    ctx.fillRect(x+16,y+26,6,3);

    // arms
    ctx.fillStyle='#a7643f';
    ctx.fillRect(x,y+20,6,13);
    ctx.fillRect(x+29,y+20,6,13);

    // head
    ctx.fillStyle='#a7643f';
    ctx.fillRect(x+8,y+5,20,16);

    // hair
    ctx.fillStyle='#2b1a12';
    for(let i=0;i<5;i++){
      ctx.beginPath();
      ctx.arc(x+10+i*4,y+6,5,0,Math.PI*2);
      ctx.fill();
    }

    // backwards black hat
    ctx.fillStyle='#111827';
    ctx.fillRect(x+6,y,24,7);
    ctx.fillRect(x+2,y+4,9,4);

    // eye
    ctx.fillStyle='#111';
    ctx.fillRect(x+23,y+11,3,4);

    ctx.restore();
  }

  function drawHUD(){
    ctx.fillStyle='rgba(15,23,42,.75)';
    ctx.fillRect(16,16,300,55);

    ctx.fillStyle='#fff';
    ctx.font='700 20px system-ui';
    ctx.fillText(`Score: ${score}`,30,50);

    for(let i=0;i<3;i++){
      const x=190+i*34;
      const y=44;

      ctx.fillStyle=
        i<player.hearts
        ?'#ef4444'
        :'rgba(255,255,255,.2)';

      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.bezierCurveTo(x-10,y-10,x-20,y+4,x,y+20);
      ctx.bezierCurveTo(x+20,y+4,x+10,y-10,x,y);
      ctx.fill();
    }
  }

  function drawParticles(){
    for(const p of particles){
      ctx.globalAlpha=clamp(p.life/50,0,1);
      ctx.fillStyle='#fbbf24';

      ctx.beginPath();
      ctx.arc(p.x-cameraX,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    }

    ctx.globalAlpha=1;
  }

  function draw(){
    drawSky();

    platforms.forEach(drawPlatform);
    coins.forEach(drawCoin);
    drawCheckpoint();
    drawGoal();
    enemies.forEach(drawEnemy);
    drawPlayer();
    drawParticles();
    drawHUD();

    ctx.font='700 16px system-ui';
    ctx.fillStyle='rgba(15,23,42,.7)';

    if(cameraX<400){
      ctx.fillText('LEVEL 1: MEADOW RUN',28,105);
    }
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown',e=>{
    if(!keys[e.key]) pressed[e.key]=true;
    keys[e.key]=true;
  });

  window.addEventListener('keyup',e=>{
    keys[e.key]=false;
  });

  function bindTouchButton(el,keyName){
    const down=e=>{
      e.preventDefault();

      if(!keys[keyName]){
        pressed[keyName]=true;
      }

      keys[keyName]=true;
      el.classList.add('active');
    };

    const up=e=>{
      e.preventDefault();
      keys[keyName]=false;
      el.classList.remove('active');
    };

    el.addEventListener('touchstart',down,{passive:false});
    el.addEventListener('touchend',up,{passive:false});
    el.addEventListener('touchcancel',up,{passive:false});

    el.addEventListener('pointerdown',down);
    el.addEventListener('pointerup',up);
    el.addEventListener('pointercancel',up);
  }

  bindTouchButton(
    document.getElementById('leftBtn'),
    'ArrowLeft'
  );

  bindTouchButton(
    document.getElementById('rightBtn'),
    'ArrowRight'
  );

  bindTouchButton(
    document.getElementById('jumpBtn'),
    ' '
  );

  document
    .querySelector('.game-shell')
    .addEventListener(
      'touchmove',
      e=>e.preventDefault(),
      {passive:false}
    );

  startBtn.addEventListener('click',()=>{
    overlay.style.display='none';
    resetGame();
  });

  draw();
  loop();
})();
</script>
</body>
</html>
